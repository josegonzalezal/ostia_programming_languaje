name: Compilar Intérprete Ostia

on: [push, pull_request]

jobs:
  build:
    name: Compilar en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Generar ejecutable
      run: |
        pyinstaller --onefile --name ostia ostia.py

    - name: Subir artefactos compilados
      uses: actions/upload-artifact@v4
      with:
        name: ostia-ejecutable-${{ matrix.os }}
        path: dist/